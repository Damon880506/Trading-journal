const $=id=>document.getElementById(id), f=$('f'), key='pa-journal-v1';let rows=[],editing=null,photo='',storageOK=true;try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch(e){storageOK=false}const fields=['symbol','side','date','closeDate','zone','timeSource','drawingStart','drawingEnd','tf','regime','trigger','entry','sl','tp','reason','fib','status','exit','netR','notes','ocrEvidence'];const num=x=>x===''||x==null?NaN:Number(x);const risk=r=>r.side==='多單'?num(r.entry)-num(r.sl):num(r.sl)-num(r.entry);const reward=r=>r.side==='多單'?num(r.tp)-num(r.entry):num(r.entry)-num(r.tp);const rr=r=>risk(r)>0&&reward(r)>0?reward(r)/risk(r):NaN;const gross=r=>risk(r)>0?(r.side==='多單'?num(r.exit)-num(r.entry):num(r.entry)-num(r.exit))/risk(r):NaN;const actual=r=>['止盈','止損','其他出場'].includes(r.status)?(Number.isFinite(num(r.netR))?num(r.netR):gross(r)):NaN;const fmt=x=>Number.isFinite(x)?x.toFixed(2):'—';const read=()=>Object.fromEntries(fields.map(k=>[k,f.elements[k].value]));function hours(a,b,z){if(!a||!b||!/^([+-])(?:0[0-9]|1[0-4]):[0-5][0-9]$/.test(z||''))return NaN;let d=(Date.parse(b+z)-Date.parse(a+z))/3600000;return d>=0?d:NaN}function duration(h){return Number.isFinite(h)?`${Math.floor(h/24)} 日 ${Math.floor(h%24)} 小時 ${Math.round(h*60)%60} 分`:'—'}function calc(){let r=read();$('duration').textContent=duration(hours(r.date,r.closeDate,r.zone));$('drawingDuration').textContent=duration(hours(r.drawingStart,r.drawingEnd,r.zone));$('rr').textContent=fmt(rr(r));$('gross').textContent=fmt(gross(r))}f.addEventListener('input',calc);function preview(){let el=$('preview');el.hidden=!photo;if(photo)el.src=photo;else el.removeAttribute('src')}function fill(r){HTMLFormElement.prototype.reset.call(f);$('evidence').textContent=r.ocrEvidence||'';fields.forEach(k=>{if(r[k]!=null)f.elements[k].value=r[k]});editing=r.id||null;photo=r.photo||'';$('shot').value='';preview();calc();$('formTitle').textContent=editing?'編輯交易':'新增交易'}function persist(next){try{localStorage.setItem(key,JSON.stringify(next));storageOK=true;rows=next;return true}catch(e){$('msg').textContent='無法寫入本機儲存，可能空間不足或瀏覽器限制。請先匯出備份。';return false}}function el(tag,txt){let e=document.createElement(tag);e.textContent=txt;return e}function render(){let closed=rows.map(actual).filter(Number.isFinite);$('stats').textContent=`已儲存 ${rows.length} 筆｜已結束 ${closed.length} 筆｜平均 R ${fmt(closed.length?closed.reduce((a,b)=>a+b,0)/closed.length:NaN)}｜勝率 ${closed.length?(100*closed.filter(x=>x>0).length/closed.length).toFixed(1)+'%':'—'}`;let root=$('records');root.replaceChildren();rows.forEach((r,i)=>{let a=el('article','');a.append(el('strong',`#${i+1} ${r.symbol} ${r.side} · ${r.status}`),el('p',`${r.regime||'行情待確認'} / ${r.trigger||'Trigger 待確認'}｜RR ${fmt(rr(r))}｜實際 R ${fmt(actual(r))}`),el('small',`進場 ${r.entry} / SL ${r.sl} / TP ${r.tp}`));let d=el('details','');d.append(el('summary','查看詳情'),el('p',[r.date&&'開倉 '+r.date,r.closeDate&&'平倉 '+r.closeDate,r.zone,r.timeSource,'持倉 '+duration(hours(r.date,r.closeDate,r.zone)),r.drawingStart&&'繪圖起點 '+r.drawingStart,r.drawingEnd&&'繪圖終點 '+r.drawingEnd,r.tf,r.reason,r.fib,r.notes,r.ocrEvidence].filter(Boolean).join('｜')));if(r.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)){let im=document.createElement('img');im.src=r.photo;d.append(im)}a.append(d);let b=el('button','編輯');b.className='secondary';b.onclick=()=>{fill(r);f.scrollIntoView()};let del=el('button','刪除');del.className='danger';del.onclick=()=>{if(confirm('確定刪除此筆？')&&persist(rows.filter(x=>x.id!==r.id))){if(editing===r.id)fill({});render()}};a.append(b,del);root.append(a)})}f.onsubmit=e=>{e.preventDefault();if(autoBusy)return;let r=read();if((r.date&&r.closeDate&&!Number.isFinite(hours(r.date,r.closeDate,r.zone)))||(r.drawingStart&&r.drawingEnd&&!Number.isFinite(hours(r.drawingStart,r.drawingEnd,r.zone)))){$('msg').textContent='請確認時間順序與時區格式。';return}if(!Number.isFinite(rr(r))||[r.entry,r.sl,r.tp].some(x=>num(x)<=0)){ $('msg').textContent='請確認進場、停損、止 const cv=$('cropCanvas'), ctx=cv.getContext('2d');let original=null,selection=null,anchor=null,worker=null,busy=false;
function loadOCR(file){if(!file)return;const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);original=im;selection=null;let scale=Math.min(1,1600/Math.max(im.width,im.height));cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.hidden=false;$('dimensions').textContent=`原始解析度 ${im.width} × ${im.height}（比例 ${(im.width/im.height).toFixed(2)}）`;paint();};im.onerror=()=>{URL.revokeObjectURL(u);$('ocrMsg').textContent='無法讀取圖片'};im.src=u}

function point(e){let r=cv.getBoundingClientRect();return [Math.max(0,Math.min(cv.width,(e.clientX-r.left)*cv.width/r.width)),Math.max(0,Math.min(cv.height,(e.clientY-r.top)*cv.height/r.height))]}

function parsePrice(t){let n=t.trim().replace(/,/g,'');return /^\d+(?:\.\d+)?$/.test(n)&&Number(n)>0?Number(n):null}

function locateBands(data,w,h){const out=[];let active=null;const x0=Math.floor(w*.84),x1=Math.floor(w*.985);for(let y=Math.floor(h*.13);y<Math.floor(h*.83);y++){let counts=[0,0,0];for(let x=x0;x<x1;x+=2){let i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2];if(r>150&&r-g>65&&r-b>50)counts[0]++;else if(g>95&&g-r>40&&g-b>-15&&b>65)counts[1]++;else if(r>=95&&r<=175&&Math.abs(r-g)<6&&Math.abs(r-b)<6)counts[2]++;}let k=counts.indexOf(Math.max(...counts)),kind=counts[k]>(x1-x0)*.22?['red','green','gray'][k]:null;if(kind&&active&&active.kind===kind){active.end=y;continue}if(active){if(active.end-active.start>=Math.max(5,h*.004)&&active.end-active.start<h*.045)out.push(active);active=null}if(kind)active={kind,start:y,end:y};}return out}

function priceFromText(t){let m=t.trim().match(/^\s*(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)\s*$/);return m?Number(m[1].replaceAll(',','')):null}
function triplets(a){let res=[];for(let i=0;i<a.length;i++){let e=a[i];if(e.kind!=='gray'||!e.value)continue;for(let u of a.slice(0,i)){for(let d of a.slice(i+1)){if(!u.value||!d.value||!(u.value>e.value&&e.value>d.value))continue;if(u.kind==='red'&&d.kind==='green')res.push({entry:e.value,sl:u.value,tp:d.value,side:'空單'});if(u.kind==='green'&&d.kind==='red')res.push({entry:e.value,sl:d.value,tp:u.value,side:'多單'})}}}return [...new Map(res.map(x=>[JSON.stringify(x),x])).values()]}
async function autoScan(file){if(!file||autoBusy)return;autoBusy=true;let url;try{$('autoStatus').textContent='正在讀取截圖…';$('save').disabled=true;$('shot').disabled=true;fill({});url=URL.createObjectURL(file);let im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});original=im;let w=im.width,h=im.height;let sc=Math.min(1,1600/Math.max(w,h));cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cv.hidden=false;paint();photo=crop(im,0,0,w,h,Math.min(1,850/Math.max(w,h))).toDataURL('image/jpeg',.65);preview();$('dimensions').textContent=w+' × '+h;let full=crop(im,0,0,w,h),pixels=full.getContext('2d').getImageData(0,0,w,h).data,bands=locateBands(pixels,w,h);$('autoStatus').textContent='自動載入辨識引擎…';let wk=await Promise.race([getWorker(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('OCR 引擎載入逾時')),45000))]);let detected=[];await wk.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789,.'});for(let b of bands.slice(0,16)){ $('autoStatus').textContent='辨識價格標籤 '+(detected.length+1)+' / '+Math.min(bands.length,16);let hh=b.end-b.start+1,x=Math.floor(w*.835),c=whiteText(crop(im,x,b.start,w-x,hh,Math.max(1,65/hh)));let result=await wk.recognize(c);detected.push({...b,value:priceFromText(result.data.text)})}let options=triplets(detected);if(options.length===1){let a=options[0];for(let k of ['entry','sl','tp','side'])f.elements[k].value=a[k];}else if(options.length>1){$('autoStatus').textContent='辨識到多組價格，請核對或手動填寫。'}
await wk.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:''});let head=await wk.recognize(crop(im,0,h*.055,w*.88,h*.095,Math.max(1,1200/w)));let symbol=head.data.text.match(/\b([A-Z0-9]+)[ /-]?(USDT|USDC)\b/i);if(symbol)f.elements.symbol.value=(symbol[1]+symbol[2]).toUpperCase();else if(/Bitcoin/i.test(head.data.text)&&/Tether/i.test(head.data.text))f.elements.symbol.value='BTCUSDT';else f.elements.symbol.value='';
let footer=await wk.recognize(crop(im,0,h*.79,w,h*.075,Math.max(1,1400/w)));let dates=[...footer.data.text.matchAll(/\b20\d{2}[-/]\d{2}[-/]\d{2}(?:[ T]+\d{2}:\d{2})?/g)].map(x=>x[0]);let times=dates.map(parseTime).filter(Boolean);if(dates.length===2&&times.length===2&&times[0]<times[1]){f.elements.drawingStart.value=times[0];f.elements.drawingEnd.value=times[1]};let evidence='OCR 日期候選：'+(dates.join('、')||'未取得')+'；繪圖時間不等於成交時間。';f.elements.ocrEvidence.value=evidence;$('evidence').textContent=evidence;calc();$('autoStatus').textContent=options.length===1?'價格已填入，請核對標的、價格與時間後儲存。':'無法唯一確定價格組合，請手動補正或使用下方框選辨識。';}catch(e){$('autoStatus').textContent='自動辨識未完成：'+(e.message||String(e))+'。可手動填寫後儲存。';}finally{URL.revokeObjectURL(url);autoBusy=false;$('shot').disabled=false;$('save').disabled=false;}}
$('shot').onchange=()=>autoScan($('shot').files[0]);document.addEventListener('paste',e=>{let file=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'))?.getAsFile();if(file){e.preventDefault();autoScan(file)}});$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();autoScan(e.dataTransfer.files[0])};
$('autoStatus').textContent='程式已就緒，等待截圖';
